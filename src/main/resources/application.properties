# =============================================
# Spring Boot
# =============================================
spring.application.name=users-management
server.port=${PORT:8080}

# Exclusión de autoconfiguración de seguridad UserDetails para usar JWT propio
spring.autoconfigure.exclude[0]=org.springframework.boot.autoconfigure.security.servlet.UserDetailsServiceAutoConfiguration

# =============================================
# Configuración de Base de Datos (PostgreSQL)
# =============================================
spring.datasource.url=${DATASOURCE_URL:jdbc:postgresql://localhost:5432/users_db}
spring.datasource.username=${DATASOURCE_USERNAME:postgres}
spring.datasource.password=${DATASOURCE_PASSWORD:postgres}
spring.datasource.driver-class-name=org.postgresql.Driver

# Configuración Hibernate / JPA (Dialecto PostgreSQL)
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# Tipo de adaptador de base de datos para arquitectura hexagonal
db.type=${DB_TYPE:postgresql}

# =============================================
# Configuración SMTP (Gmail)
# =============================================
spring.mail.host=${MAIL_HOST:smtp.gmail.com}
spring.mail.port=${MAIL_PORT:587}
spring.mail.username=${MAIL_USERNAME:scuadrod@gmail.com}
spring.mail.password=${MAIL_PASSWORD:hrjnxuvflclcarns}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true

# Claves legacy para compatibilidad interna
smtp.host=${spring.mail.host}
smtp.port=${spring.mail.port}
smtp.username=${spring.mail.username}
smtp.password=${spring.mail.password}
smtp.from.address=${MAIL_FROM_ADDRESS:${spring.mail.username}}
smtp.from.name=${MAIL_FROM_NAME:Gestion de Usuarios}

# =============================================
# Seguridad JWT
# En producción defina JWT_SECRET con al menos 32 bytes aleatorios codificados en Base64.
# =============================================
jwt.secret=${JWT_SECRET:ZGV2ZWxvcG1lbnQtb25seS1qd3Qtc2VjcmV0LW11c3QtYmUtcmVwbGFjZWQ=}
jwt.expiration-seconds=${JWT_EXPIRATION_SECONDS:900}
